<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Control Tower</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗼</text></svg>">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">🗼</span> Control Tower</div>
    <button class="new-btn" id="newTopic">＋ New topic</button>
    <nav id="filters"></nav>
    <div class="sidebar-foot">
      <button class="ghost" id="refreshBtn" title="Read new conversations">↻ Refresh</button>
      <div class="muted small" id="refreshInfo"></div>
    </div>
  </aside>

  <section class="list-pane">
    <div class="search"><input id="search" placeholder="Search topics…" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <main class="detail" id="detail">
    <div class="empty-state">
      <div class="big">🗼</div>
      <p>Pick a topic on the left<br><span class="muted">or create a new one.</span></p>
    </div>
  </main>
</div>

<div class="modal-bg hidden" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast hidden" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
